spring.application.name=Pharmacies
# Mode de l'application
app.mode=PRODUCTION
# Date de dÃ©marrage (ISO 8601)
app.startDate=2025-10-06T20:10:00+01:00

# Configuration de log dÃ©taillÃ©e pour JWT et Spring Security
#logging.level.org.springframework.security=DEBUG
#logging.level.com.yourpackage.jwt=DEBUG
#logging.level.org.hibernate=DEBUG
# Fichier de logs
logging.file.path=logs
logging.file.name=logs/pharmacies.log
logging.level.com.gestion.invoice.service.impl=DEBUG
logging.level.com.gestion.invoice=DEBUG

# Logs pour les requÃªtes HTTP (utile pour voir les Ã©changes de token)
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=TRACE

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===============================
# CONFIGURATION BASE DE DONNÃES MYSQLs
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/dbvente?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURATION JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

