name: CD Deploy

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker (optional)
        # Si tu veux pousser tes images sur Docker Hub, sinon ignore cette étape
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and start all services including DB
        run: |
          # On utilise docker compose avec ton fichier yml
          docker compose -f docker-compose.yml up --build -d

      - name: Wait for DB to be ready
        run: |
          echo "Attente que la DB MySQL soit prête..."
          docker exec dbvente bash -c 'until mysqladmin ping -h"localhost" --silent; do sleep 2; done'

      - name: Verify services
        run: docker ps