name: CI Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build Frontend
        working-directory: Front
        run: |
          npm install
          npm run build
      - name: Build Front Docker Image
        run: |
          docker build -t frontend:dev ./Front

  backend:
    runs-on: ubuntu-latest
    needs: frontend  # pour respecter l'ordre
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17    # <- Java 17 ici
      - name: Build Backend
        working-directory: Backend
        run: mvn clean install -DskipTests
      - name: Build Backend Docker Image
        run: |
          docker build -t backend:dev ./Backend