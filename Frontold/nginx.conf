server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        # pour servir les fichiers statiques correctement
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}